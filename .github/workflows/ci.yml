name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 python3-gi python3-gi-cairo gir1.2-gtk-3.0 desktop-file-utils
      - name: Unit and service tests
        run: make test
      - name: End-to-end tests (network namespaces)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          make integration
      - name: Build the package
        run: |
          desktop-file-validate data/io.github.proxywall.ProxyWall.desktop
          make deb
      - uses: actions/upload-artifact@v4
        with:
          name: proxywall-deb
          path: dist/*.deb
